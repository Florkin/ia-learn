[project]
name = "ia-learn"
version = "0.1.0"
description = "Hands-on AI engineering course: one assistant, built layer by layer"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.24",
    "numpy>=2.0",
    "chromadb>=1.5",
]

# Heavy dependencies are installed when a module needs them:
#   uv sync --group langchain   (module 11)
#   uv sync --group training    (modules 13 and 14)
[dependency-groups]
langchain = [
    "langchain>=1.4",
    "langchain-openai>=1.6",
    "langchain-chroma>=1.1",
]
training = [
    "torch>=2.14",
    "transformers>=5.18",
    "peft>=0.21",
    "mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant", "course"]
